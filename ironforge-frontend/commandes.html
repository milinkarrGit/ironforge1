<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>IRONFORGE - Mes Commandes</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    :root {
        --orange: #FF6B00;
        --gradient: linear-gradient(135deg, #FF6B00, #FF0000);
        --noir: #0A0A0A;
        --noir-card: #1A1A1A;
        --blanc: #FFFFFF;
        --gris: #888888;
        --vert: #00C853;
        --sidebar-width: 260px;
    }
    body {
        font-family: 'Poppins', sans-serif;
        background: var(--noir);
        color: var(--blanc);
        display: flex; min-height: 100vh;
    }
    .sidebar {
        width: var(--sidebar-width);
        background: var(--noir-card);
        height: 100vh; position: fixed;
        left: 0; top: 0;
        display: flex; flex-direction: column;
        border-right: 1px solid rgba(255,255,255,0.05);
        z-index: 100;
    }
    .sidebar-logo {
        padding: 25px;
        display: flex; align-items: center; gap: 10px;
        border-bottom: 1px solid rgba(255,255,255,0.05);
        text-decoration: none;
    }
    .logo-text {
        font-family: 'Bebas Neue', sans-serif;
        font-size: 26px; letter-spacing: 2px; color: var(--blanc);
    }
    .logo-text em { color: var(--orange); font-style: normal; }
    .sidebar-nav { flex: 1; padding: 20px 0; overflow-y: auto; }
    .nav-section { padding: 0 15px; margin-bottom: 25px; }
    .nav-section-title {
        font-size: 11px; font-weight: 600; color: var(--gris);
        letter-spacing: 2px; text-transform: uppercase;
        padding: 0 10px; margin-bottom: 8px;
    }
    .nav-item {
        display: flex; align-items: center; gap: 12px;
        padding: 12px 10px; border-radius: 10px;
        color: rgba(255,255,255,0.6); text-decoration: none;
        font-size: 14px; font-weight: 500;
        transition: all 0.3s; margin-bottom: 4px;
    }
    .nav-item:hover { background: rgba(255,255,255,0.05); color: var(--blanc); }
    .nav-item.active {
        background: rgba(255,107,0,0.15);
        color: var(--orange);
        border-left: 3px solid var(--orange);
    }
    .nav-item i { width: 20px; font-size: 16px; }
    .sidebar-footer {
        padding: 20px 25px;
        border-top: 1px solid rgba(255,255,255,0.05);
    }
    .btn-logout {
        display: flex; align-items: center; gap: 10px;
        color: rgba(255,255,255,0.4); font-size: 14px;
        cursor: pointer; background: none; border: none;
        font-family: 'Poppins', sans-serif; width: 100%;
    }
    .btn-logout:hover { color: #FF4444; }
    .main-content {
        margin-left: var(--sidebar-width);
        flex: 1; display: flex; flex-direction: column;
    }
    .page-header {
        background: var(--noir-card);
        padding: 25px 35px;
        border-bottom: 1px solid rgba(255,255,255,0.05);
        position: sticky; top: 0; z-index: 50;
    }
    .page-header h1 {
        font-family: 'Bebas Neue', sans-serif;
        font-size: 28px; letter-spacing: 2px;
    }
    .page-header h1 span { color: var(--orange); }
    .page-body { padding: 35px; flex: 1; }
    .stats-row {
        display: grid;
        grid-template-columns: repeat(3, 1fr);
        gap: 20px; margin-bottom: 30px;
    }
    .stat-card {
        background: var(--noir-card);
        padding: 25px; border-radius: 16px;
        border: 1px solid rgba(255,255,255,0.05);
        text-align: center;
    }
    .stat-icon { font-size: 30px; margin-bottom: 10px; }
    .stat-value {
        font-family: 'Bebas Neue', sans-serif;
        font-size: 40px; color: var(--orange);
    }
    .stat-label { color: var(--gris); font-size: 13px; }
    .commandes-list {
        display: flex; flex-direction: column; gap: 20px;
    }
    .commande-card {
        background: var(--noir-card);
        border-radius: 16px;
        border: 1px solid rgba(255,255,255,0.05);
        overflow: hidden; transition: all 0.3s;
    }
    .commande-card:hover {
        border-color: rgba(255,107,0,0.2);
    }
    .commande-header {
        padding: 18px 25px;
        display: flex; align-items: center;
        justify-content: space-between;
        border-bottom: 1px solid rgba(255,255,255,0.05);
        background: rgba(255,255,255,0.02);
    }
    .commande-id {
        font-family: 'Bebas Neue', sans-serif;
        font-size: 18px; color: var(--orange);
    }
    .commande-date {
        font-size: 13px; color: var(--gris);
    }
    .commande-status {
        padding: 5px 15px; border-radius: 50px;
        font-size: 12px; font-weight: 700;
    }
    .status-EN_ATTENTE {
        background: rgba(255,215,0,0.15); color: #FFD700;
    }
    .status-CONFIRMEE {
        background: rgba(0,200,83,0.15); color: var(--vert);
    }
    .status-LIVREE {
        background: rgba(33,150,243,0.15); color: #2196F3;
    }
    .status-ANNULEE {
        background: rgba(255,68,68,0.15); color: #FF4444;
    }
    .commande-body { padding: 20px 25px; }
    .commande-produits {
        display: flex; gap: 15px;
        flex-wrap: wrap; margin-bottom: 15px;
    }
    .produit-item {
        display: flex; align-items: center; gap: 10px;
        background: rgba(255,255,255,0.03);
        padding: 10px; border-radius: 10px;
        border: 1px solid rgba(255,255,255,0.05);
    }
    .produit-img {
        width: 45px; height: 45px;
        border-radius: 8px; object-fit: cover;
    }
    .produit-nom {
        font-size: 13px; font-weight: 600;
    }
    .produit-prix {
        font-size: 12px; color: var(--orange);
    }
    .commande-footer {
        display: flex; align-items: center;
        justify-content: space-between;
        padding-top: 15px;
        border-top: 1px solid rgba(255,255,255,0.05);
    }
    .commande-total {
        font-size: 18px; font-weight: 700; color: var(--orange);
    }
    .btn-detail {
        padding: 8px 20px;
        background: rgba(255,107,0,0.1);
        border: 1px solid rgba(255,107,0,0.2);
        color: var(--orange); border-radius: 8px;
        cursor: pointer; font-size: 13px;
        font-weight: 600;
        font-family: 'Poppins', sans-serif;
        transition: all 0.3s;
    }
    .btn-detail:hover {
        background: var(--orange); color: var(--blanc);
    }
    .empty-state {
        text-align: center; padding: 60px 20px; color: var(--gris);
    }
    .empty-state i {
        font-size: 48px; margin-bottom: 15px;
        display: block; opacity: 0.3;
    }
    .btn-shop {
        display: inline-flex; align-items: center; gap: 8px;
        margin-top: 20px; padding: 14px 30px;
        background: var(--gradient);
        color: var(--blanc); border-radius: 50px;
        font-size: 15px; font-weight: 700;
        text-decoration: none; transition: all 0.3s;
    }
    .btn-shop:hover {
        transform: translateY(-2px);
        box-shadow: 0 10px 25px rgba(255,107,0,0.4);
    }
    @media (max-width: 768px) {
        .sidebar { display: none; }
        .main-content { margin-left: 0; }
        .stats-row { grid-template-columns: 1fr; }
        .page-body { padding: 20px; }
    }
  </style>
</head>
<body>

<aside class="sidebar">
  <a href="index.html" class="sidebar-logo">
    <span style="font-size:28px">🔥</span>
    <span class="logo-text">IRON<em>FORGE</em></span>
  </a>
  <nav class="sidebar-nav">
    <div class="nav-section">
      <div class="nav-section-title">Principal</div>
      <a class="nav-item" href="dashboard.html">
        <i class="fas fa-home"></i> Dashboard
      </a>
      <a class="nav-item" href="profil.html">
        <i class="fas fa-user"></i> Mon Profil
      </a>
      <a class="nav-item" href="mes-seances.html">
        <i class="fas fa-calendar-check"></i> Mes Séances
      </a>
    </div>
    <div class="nav-section">
      <div class="nav-section-title">Entraînement</div>
      <a class="nav-item" href="programmes.html">
        <i class="fas fa-dumbbell"></i> Programmes
      </a>
    </div>
    <div class="nav-section">
      <div class="nav-section-title">Commerce</div>
      <a class="nav-item" href="boutique.html">
        <i class="fas fa-store"></i> Boutique
      </a>
      <a class="nav-item active" href="commandes.html">
        <i class="fas fa-box"></i> Mes Commandes
      </a>
    </div>
  </nav>
  <div class="sidebar-footer">
    <button class="btn-logout" onclick="logout()">
      <i class="fas fa-sign-out-alt"></i>
      Se déconnecter
    </button>
  </div>
</aside>

<div class="main-content">
  <header class="page-header">
    <div>
      <h1>MES <span>COMMANDES</span></h1>
      <p style="color:var(--gris);font-size:13px;margin-top:3px">
        Historique de vos achats
      </p>
    </div>
  </header>

  <div class="page-body">
    <div class="stats-row">
      <div class="stat-card">
        <div class="stat-icon">🛒</div>
        <div class="stat-value" id="totalCommandes">0</div>
        <div class="stat-label">Total Commandes</div>
      </div>
      <div class="stat-card">
        <div class="stat-icon">💰</div>
        <div class="stat-value" id="totalDepense">0€</div>
        <div class="stat-label">Total Dépensé</div>
      </div>
      <div class="stat-card">
        <div class="stat-icon">📦</div>
        <div class="stat-value" id="enCours">0</div>
        <div class="stat-label">En cours</div>
      </div>
    </div>

    <div class="commandes-list" id="commandesList">
      <div class="empty-state">
        <i class="fas fa-spinner fa-spin"></i>
        Chargement...
      </div>
    </div>
  </div>
</div>

<script>
  const API_URL = 'https://ironforge1.onrender.com';
  const token = localStorage.getItem('token');
  if (!token) window.location.href = 'login.html';

  const headers = {
      'Authorization': `Bearer ${token}`,
      'Content-Type': 'application/json'
  };

  const loadCommandes = async () => {
      try {
          const res = await fetch(
              `${API_URL}/api/commandes/mes-commandes`,
              { headers });
          const data = await res.json();

          const list = document.getElementById('commandesList');

          if (data.succes && data.data && data.data.length > 0) {
              const commandes = data.data;

              const total = commandes.reduce(
                  (sum, c) => sum + (c.total || 0), 0);
              const enCours = commandes.filter(c =>
                  c.statut === 'EN_ATTENTE' ||
                  c.statut === 'CONFIRMEE').length;

              document.getElementById('totalCommandes')
                  .textContent = commandes.length;
              document.getElementById('totalDepense')
                  .textContent = `${total.toFixed(0)}€`;
              document.getElementById('enCours')
                  .textContent = enCours;

              list.innerHTML = commandes.map(c => {
                  const date = new Date(c.dateCommande);
                  const dateStr = date.toLocaleDateString('fr-FR', {
                      day: '2-digit', month: 'long', year: 'numeric'
                  });

                  return `
                  <div class="commande-card">
                      <div class="commande-header">
                          <div>
                              <div class="commande-id">
                                  Commande #${c.id}
                              </div>
                              <div class="commande-date">
                                  ${dateStr}
                              </div>
                          </div>
                          <span class="commande-status status-${c.statut}">
                              ${c.statut === 'EN_ATTENTE' ? '⏳ En attente' :
                                c.statut === 'CONFIRMEE' ? '✅ Confirmée' :
                                c.statut === 'LIVREE' ? '📦 Livrée' :
                                '❌ Annulée'}
                          </span>
                      </div>
                      <div class="commande-body">
                          <div class="commande-produits">
                              ${c.produits?.map(p => `
                              <div class="produit-item">
                                  <img src="https://picsum.photos/45/45?random=${p.id}"
                                      class="produit-img" alt="${p.nom}">
                                  <div>
                                      <div class="produit-nom">${p.nom}</div>
                                      <div class="produit-prix">${p.prix}€</div>
                                  </div>
                              </div>`).join('') ||
                              '<p style="color:var(--gris);font-size:13px">Aucun produit</p>'}
                          </div>
                          <div class="commande-footer">
                              <div>
                                  <span style="color:var(--gris);font-size:13px">
                                      Total :
                                  </span>
                                  <span class="commande-total">
                                      ${c.total}€
                                  </span>
                              </div>
                              <button class="btn-detail">
                                  Voir détails
                              </button>
                          </div>
                      </div>
                  </div>`;
              }).join('');

          } else {
              list.innerHTML = `
                  <div class="empty-state">
                      <i class="fas fa-box-open"></i>
                      <p style="font-size:16px;font-weight:600;
                          margin-bottom:10px">
                          Aucune commande
                      </p>
                      <p>Visitez notre boutique !</p>
                      <a href="boutique.html" class="btn-shop">
                          <i class="fas fa-store"></i>
                          Aller à la boutique
                      </a>
                  </div>`;
          }
      } catch (err) {
          console.error('Erreur commandes:', err);
      }
  };

  const logout = () => {
      localStorage.removeItem('token');
      localStorage.removeItem('user');
      window.location.href = 'login.html';
  };

  loadCommandes();
</script>
</body>
</html>
