<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>IRONFORGE - Mes Séances</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    :root {
        --orange: #FF6B00;
        --gradient: linear-gradient(135deg, #FF6B00, #FF0000);
        --noir: #0A0A0A;
        --noir-card: #1A1A1A;
        --blanc: #FFFFFF;
        --gris: #888888;
        --vert: #00C853;
        --sidebar-width: 260px;
    }
    body {
        font-family: 'Poppins', sans-serif;
        background: var(--noir);
        color: var(--blanc);
        display: flex; min-height: 100vh;
    }
    .sidebar {
        width: var(--sidebar-width);
        background: var(--noir-card);
        height: 100vh; position: fixed;
        left: 0; top: 0;
        display: flex; flex-direction: column;
        border-right: 1px solid rgba(255,255,255,0.05);
        z-index: 100;
    }
    .sidebar-logo {
        padding: 25px;
        display: flex; align-items: center; gap: 10px;
        border-bottom: 1px solid rgba(255,255,255,0.05);
        text-decoration: none;
    }
    .logo-text {
        font-family: 'Bebas Neue', sans-serif;
        font-size: 26px; letter-spacing: 2px; color: var(--blanc);
    }
    .logo-text em { color: var(--orange); font-style: normal; }
    .sidebar-nav { flex: 1; padding: 20px 0; overflow-y: auto; }
    .nav-section { padding: 0 15px; margin-bottom: 25px; }
    .nav-section-title {
        font-size: 11px; font-weight: 600; color: var(--gris);
        letter-spacing: 2px; text-transform: uppercase;
        padding: 0 10px; margin-bottom: 8px;
    }
    .nav-item {
        display: flex; align-items: center; gap: 12px;
        padding: 12px 10px; border-radius: 10px;
        color: rgba(255,255,255,0.6); text-decoration: none;
        font-size: 14px; font-weight: 500;
        transition: all 0.3s; margin-bottom: 4px;
    }
    .nav-item:hover { background: rgba(255,255,255,0.05); color: var(--blanc); }
    .nav-item.active {
        background: rgba(255,107,0,0.15);
        color: var(--orange);
        border-left: 3px solid var(--orange);
    }
    .nav-item i { width: 20px; font-size: 16px; }
    .sidebar-footer {
        padding: 20px 25px;
        border-top: 1px solid rgba(255,255,255,0.05);
    }
    .btn-logout {
        display: flex; align-items: center; gap: 10px;
        color: rgba(255,255,255,0.4); font-size: 14px;
        cursor: pointer; background: none; border: none;
        font-family: 'Poppins', sans-serif; width: 100%;
    }
    .btn-logout:hover { color: #FF4444; }
    .main-content {
        margin-left: var(--sidebar-width);
        flex: 1; display: flex; flex-direction: column;
    }
    .page-header {
        background: var(--noir-card);
        padding: 25px 35px;
        display: flex; align-items: center;
        justify-content: space-between;
        border-bottom: 1px solid rgba(255,255,255,0.05);
        position: sticky; top: 0; z-index: 50;
    }
    .page-header h1 {
        font-family: 'Bebas Neue', sans-serif;
        font-size: 28px; letter-spacing: 2px;
    }
    .page-header h1 span { color: var(--orange); }
    .page-body { padding: 35px; flex: 1; }
    .stats-row {
        display: grid;
        grid-template-columns: repeat(3, 1fr);
        gap: 20px; margin-bottom: 30px;
    }
    .stat-card {
        background: var(--noir-card);
        padding: 25px; border-radius: 16px;
        border: 1px solid rgba(255,255,255,0.05);
        text-align: center;
    }
    .stat-icon { font-size: 30px; margin-bottom: 10px; }
    .stat-value {
        font-family: 'Bebas Neue', sans-serif;
        font-size: 40px; color: var(--orange);
    }
    .stat-label { color: var(--gris); font-size: 13px; }
    .tabs {
        display: flex; gap: 5px; margin-bottom: 25px;
        background: var(--noir-card);
        padding: 5px; border-radius: 12px;
        width: fit-content;
    }
    .tab-btn {
        padding: 10px 20px; border-radius: 8px;
        border: none; background: transparent;
        color: var(--gris); font-size: 14px;
        font-weight: 500; cursor: pointer;
        transition: all 0.3s;
        font-family: 'Poppins', sans-serif;
    }
    .tab-btn.active {
        background: var(--gradient); color: var(--blanc);
    }
    .seances-list { display: flex; flex-direction: column; gap: 15px; }
    .seance-card {
        background: var(--noir-card);
        border-radius: 16px; padding: 20px;
        border: 1px solid rgba(255,255,255,0.05);
        display: flex; align-items: center; gap: 20px;
        transition: all 0.3s;
    }
    .seance-card:hover {
        border-color: rgba(255,107,0,0.2);
        transform: translateX(5px);
    }
    .seance-date-box {
        width: 65px; height: 65px;
        background: var(--gradient);
        border-radius: 14px;
        display: flex; flex-direction: column;
        align-items: center; justify-content: center;
        flex-shrink: 0;
    }
    .date-day {
        font-family: 'Bebas Neue', sans-serif;
        font-size: 26px; line-height: 1;
    }
    .date-month {
        font-size: 11px; font-weight: 700;
        letter-spacing: 1px;
    }
    .seance-info { flex: 1; }
    .seance-title {
        font-size: 16px; font-weight: 700; margin-bottom: 5px;
    }
    .seance-meta {
        display: flex; gap: 20px; margin-top: 5px;
    }
    .seance-meta span {
        font-size: 13px; color: var(--gris);
        display: flex; align-items: center; gap: 5px;
    }
    .seance-meta i { color: var(--orange); }
    .seance-status {
        padding: 6px 16px; border-radius: 50px;
        font-size: 12px; font-weight: 700;
    }
    .status-RESERVEE {
        background: rgba(255,107,0,0.15); color: var(--orange);
    }
    .status-TERMINEE {
        background: rgba(0,200,83,0.15); color: var(--vert);
    }
    .status-ANNULEE {
        background: rgba(255,68,68,0.15); color: #FF4444;
    }
    .btn-annuler {
        padding: 8px 16px;
        background: rgba(255,68,68,0.1);
        border: 1px solid rgba(255,68,68,0.3);
        color: #FF4444; border-radius: 8px;
        cursor: pointer; font-size: 13px;
        font-weight: 600;
        font-family: 'Poppins', sans-serif;
        transition: all 0.3s; margin-left: 10px;
    }
    .btn-annuler:hover {
        background: #FF4444; color: var(--blanc);
    }
    .empty-state {
        text-align: center; padding: 60px 20px;
        color: var(--gris);
    }
    .empty-state i {
        font-size: 48px; margin-bottom: 15px;
        display: block; opacity: 0.3;
    }
    .btn-reserver-now {
        display: inline-flex; align-items: center; gap: 8px;
        margin-top: 20px; padding: 14px 30px;
        background: var(--gradient);
        color: var(--blanc); border: none;
        border-radius: 50px; font-size: 15px;
        font-weight: 700; cursor: pointer;
        font-family: 'Poppins', sans-serif;
        text-decoration: none; transition: all 0.3s;
    }
    .btn-reserver-now:hover {
        transform: translateY(-2px);
        box-shadow: 0 10px 25px rgba(255,107,0,0.4);
    }
    @media (max-width: 768px) {
        .sidebar { display: none; }
        .main-content { margin-left: 0; }
        .stats-row { grid-template-columns: 1fr; }
        .page-body { padding: 20px; }
    }
  </style>
</head>
<body>

<aside class="sidebar">
  <a href="index.html" class="sidebar-logo">
    <span style="font-size:28px">🔥</span>
    <span class="logo-text">IRON<em>FORGE</em></span>
  </a>
  <nav class="sidebar-nav">
    <div class="nav-section">
      <div class="nav-section-title">Principal</div>
      <a class="nav-item" href="dashboard.html">
        <i class="fas fa-home"></i> Dashboard
      </a>
      <a class="nav-item" href="profil.html">
        <i class="fas fa-user"></i> Mon Profil
      </a>
      <a class="nav-item active" href="mes-seances.html">
        <i class="fas fa-calendar-check"></i> Mes Séances
      </a>
    </div>
    <div class="nav-section">
      <div class="nav-section-title">Entraînement</div>
      <a class="nav-item" href="programmes.html">
        <i class="fas fa-dumbbell"></i> Programmes
      </a>
      <a class="nav-item" href="programmes.html">
        <i class="fas fa-fire"></i> Réserver Séance
      </a>
    </div>
    <div class="nav-section">
      <div class="nav-section-title">Commerce</div>
      <a class="nav-item" href="boutique.html">
        <i class="fas fa-store"></i> Boutique
      </a>
      <a class="nav-item" href="commandes.html">
        <i class="fas fa-box"></i> Mes Commandes
      </a>
    </div>
  </nav>
  <div class="sidebar-footer">
    <button class="btn-logout" onclick="logout()">
      <i class="fas fa-sign-out-alt"></i>
      Se déconnecter
    </button>
  </div>
</aside>

<div class="main-content">
  <header class="page-header">
    <div>
      <h1>MES <span>SÉANCES</span></h1>
      <p style="color:var(--gris);font-size:13px;margin-top:3px">
        Historique et réservations
      </p>
    </div>
    <a href="programmes.html" class="btn-reserver-now">
      <i class="fas fa-plus"></i> Réserver une séance
    </a>
  </header>

  <div class="page-body">

    <div class="stats-row">
      <div class="stat-card">
        <div class="stat-icon">📅</div>
        <div class="stat-value" id="totalSeances">0</div>
        <div class="stat-label">Total Séances</div>
      </div>
      <div class="stat-card">
        <div class="stat-icon">✅</div>
        <div class="stat-value" id="seancesReservees">0</div>
        <div class="stat-label">À venir</div>
      </div>
      <div class="stat-card">
        <div class="stat-icon">🏆</div>
        <div class="stat-value" id="seancesTerminees">0</div>
        <div class="stat-label">Terminées</div>
      </div>
    </div>

    <div class="tabs">
      <button class="tab-btn active"
              onclick="filterSeances('toutes', this)">
        Toutes
      </button>
      <button class="tab-btn"
              onclick="filterSeances('RESERVEE', this)">
        À venir
      </button>
      <button class="tab-btn"
              onclick="filterSeances('TERMINEE', this)">

        Terminées
      </button>
      <button class="tab-btn"
              onclick="filterSeances('ANNULEE', this)">
        Annulées
      </button>
    </div>

    <div class="seances-list" id="seancesList">
      <div class="empty-state">
        <i class="fas fa-spinner fa-spin"></i>
        Chargement...
      </div>
    </div>

  </div>
</div>

<script>
  const API_URL = 'http://localhost:8085';
  const token = localStorage.getItem('token');
  if (!token) window.location.href = 'login.html';

  const headers = {
      'Authorization': `Bearer ${token}`,
      'Content-Type': 'application/json'
  };

  let allSeances = [];

  const loadSeances = async () => {
      try {
          const res = await fetch(
              `${API_URL}/api/seances/mes-seances`,
              { headers });
          const data = await res.json();

          if (data.succes && data.data) {
              allSeances = data.data;

              const reservees = allSeances.filter(
                  s => s.statut === 'RESERVEE').length;
              const terminees = allSeances.filter(
                  s => s.statut === 'TERMINEE').length;

              document.getElementById('totalSeances')
                  .textContent = allSeances.length;
              document.getElementById('seancesReservees')
                  .textContent = reservees;
              document.getElementById('seancesTerminees')
                  .textContent = terminees;

              renderSeances(allSeances);
          } else {
              renderEmpty();
          }
      } catch (err) {
          renderEmpty();
      }
  };

  const renderSeances = (seances) => {
      const list = document.getElementById('seancesList');

      if (seances.length === 0) {
          renderEmpty();
          return;
      }

      list.innerHTML = seances.map(s => {
          const date = new Date(s.date);
          const day = date.getDate();
          const month = date.toLocaleDateString('fr-FR',
              { month: 'short' }).toUpperCase();
          const coachNom = s.coach?.utilisateur?.nom || 'Coach';
          const coachPrenom = s.coach?.utilisateur?.prenom || '';

          return `
          <div class="seance-card">
              <div class="seance-date-box">
                  <span class="date-day">${day}</span>
                  <span class="date-month">${month}</span>
              </div>
              <div class="seance-info">
                  <div class="seance-title">
                      Séance avec ${coachPrenom} ${coachNom}
                  </div>
                  <div class="seance-meta">
                      <span>
                          <i class="fas fa-clock"></i>
                          ${s.heureDebut || '?'} - ${s.heureFin || '?'}
                      </span>
                      <span>
                          <i class="fas fa-tag"></i>
                          ${s.prix || 0}€
                      </span>
                  </div>
              </div>
              <span class="seance-status status-${s.statut}">
                  ${s.statut === 'RESERVEE' ? '📅 Réservée' :
                    s.statut === 'TERMINEE' ? '✅ Terminée' :
                    '❌ Annulée'}
              </span>
              ${s.statut === 'RESERVEE' ? `
              <button class="btn-annuler"
                  onclick="annulerSeance(${s.id})">
                  Annuler
              </button>` : ''}
          </div>`;
      }).join('');
  };

  const renderEmpty = () => {
      document.getElementById('seancesList').innerHTML = `
          <div class="empty-state">
              <i class="fas fa-calendar-times"></i>
              <p style="font-size:16px;font-weight:600;
                  margin-bottom:10px">
                  Aucune séance trouvée
              </p>
              <p>Réservez votre première séance !</p>
              <a href="programmes.html"
                  class="btn-reserver-now">
                  <i class="fas fa-fire"></i>
                  Voir les séances disponibles
              </a>
          </div>`;
  };

  const filterSeances = (statut, btn) => {
      document.querySelectorAll('.tab-btn')
          .forEach(b => b.classList.remove('active'));
      btn.classList.add('active');

      const filtered = statut === 'toutes' ?
          allSeances :
          allSeances.filter(s => s.statut === statut);
      renderSeances(filtered);
  };

  const annulerSeance = async (id) => {
      if (!confirm('Voulez-vous annuler cette séance ?')) return;

      try {
          const res = await fetch(
              `${API_URL}/api/seances/annuler/${id}`, {
              method: 'PUT', headers
          });
          const data = await res.json();
          if (data.succes) {
              loadSeances();
          }
      } catch (err) {
          console.error('Erreur annulation:', err);
      }
  };

  const logout = () => {
      localStorage.removeItem('token');
      localStorage.removeItem('user');
      window.location.href = 'login.html';
  };

  loadSeances();
</script>
</body>
</html>
