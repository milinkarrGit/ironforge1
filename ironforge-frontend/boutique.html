<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script src="https://js.stripe.com/v3/" crossorigin="anonymous"></script>
    <title>IRONFORGE - Boutique</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">

    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }

        :root {
            --orange: #FF6B00;
            --gradient: linear-gradient(135deg, #FF6B00, #FF0000);
            --noir: #0A0A0A;
            --noir-card: #1A1A1A;
            --noir-light: #252525;
            --blanc: #FFFFFF;
            --gris: #888888;
            --vert: #00C853;
            --sidebar-width: 260px;
        }

        body {
            font-family: 'Poppins', sans-serif;
            background: var(--noir);
            color: var(--blanc);
            display: flex;
            min-height: 100vh;
        }

        /* ===== SIDEBAR ===== */
        .sidebar {
            width: var(--sidebar-width);
            background: var(--noir-card);
            height: 100vh;
            position: fixed;
            left: 0;
            top: 0;
            display: flex;
            flex-direction: column;
            border-right: 1px solid rgba(255,255,255,0.05);
            z-index: 100;
        }

        .sidebar-logo {
            padding: 30px 25px;
            display: flex;
            align-items: center;
            gap: 10px;
            border-bottom: 1px solid rgba(255,255,255,0.05);
            text-decoration: none;
        }

        .logo-text {
            font-family: 'Bebas Neue', sans-serif;
            font-size: 26px;
            letter-spacing: 2px;
            color: var(--blanc);
        }

        .logo-text em {
            color: var(--orange);
            font-style: normal;
        }

        .sidebar-nav {
            flex: 1;
            padding: 20px 0;
            overflow-y: auto;
        }

        .nav-section {
            padding: 0 15px;
            margin-bottom: 25px;
        }

        .nav-section-title {
            font-size: 11px;
            font-weight: 600;
            color: var(--gris);
            letter-spacing: 2px;
            text-transform: uppercase;
            padding: 0 10px;
            margin-bottom: 8px;
        }

        .nav-item {
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 12px 10px;
            border-radius: 10px;
            color: rgba(255,255,255,0.6);
            text-decoration: none;
            font-size: 14px;
            font-weight: 500;
            transition: all 0.3s;
            margin-bottom: 4px;
        }

        .nav-item:hover {
            background: rgba(255,255,255,0.05);
            color: var(--blanc);
        }

        .nav-item.active {
            background: rgba(255,107,0,0.15);
            color: var(--orange);
            border-left: 3px solid var(--orange);
        }

        .nav-item i { width: 20px; font-size: 16px; }

        .sidebar-footer {
            padding: 20px 25px;
            border-top: 1px solid rgba(255,255,255,0.05);
        }

        .btn-logout {
            display: flex;
            align-items: center;
            gap: 10px;
            color: rgba(255,255,255,0.4);
            font-size: 14px;
            cursor: pointer;
            background: none;
            border: none;
            font-family: 'Poppins', sans-serif;
            width: 100%;
            transition: color 0.3s;
        }

        .btn-logout:hover { color: #FF4444; }

        /* ===== MAIN ===== */
        .main-content {
            margin-left: var(--sidebar-width);
            flex: 1;
            display: flex;
            flex-direction: column;
        }

        /* ===== HEADER ===== */
        .page-header {
            background: var(--noir-card);
            padding: 25px 35px;
            border-bottom: 1px solid rgba(255,255,255,0.05);
            display: flex;
            align-items: center;
            justify-content: space-between;
            position: sticky;
            top: 0;
            z-index: 50;
        }

        .page-header h1 {
            font-family: 'Bebas Neue', sans-serif;
            font-size: 28px;
            letter-spacing: 2px;
        }

        .page-header h1 span { color: var(--orange); }

        .header-actions {
            display: flex;
            align-items: center;
            gap: 15px;
        }

        .cart-btn {
            display: flex;
            align-items: center;
            gap: 8px;
            background: rgba(255,107,0,0.1);
            border: 1px solid rgba(255,107,0,0.3);
            color: var(--orange);
            padding: 10px 20px;
            border-radius: 50px;
            cursor: pointer;
            font-family: 'Poppins', sans-serif;
            font-size: 14px;
            font-weight: 600;
            transition: all 0.3s;
        }

        .cart-btn:hover {
            background: var(--orange);
            color: var(--blanc);
        }

        .cart-count {
            background: var(--orange);
            color: var(--blanc);
            width: 20px;
            height: 20px;
            border-radius: 50%;
            font-size: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: 700;
        }

        /* ===== BOUTIQUE BODY ===== */
        .boutique-body {
            padding: 35px;
            flex: 1;
        }

        /* ===== FILTRES ===== */
        .filtres {
            display: flex;
            gap: 15px;
            margin-bottom: 35px;
            flex-wrap: wrap;
            align-items: center;
        }

        .filtre-search {
            flex: 1;
            min-width: 200px;
            position: relative;
        }

        .filtre-search input {
            width: 100%;
            padding: 12px 20px 12px 45px;
            background: var(--noir-card);
            border: 1px solid rgba(255,255,255,0.1);
            border-radius: 50px;
            color: var(--blanc);
            font-size: 14px;
            font-family: 'Poppins', sans-serif;
            outline: none;
            transition: border-color 0.3s;
        }

        .filtre-search input:focus {
            border-color: var(--orange);
        }

        .filtre-search i {
            position: absolute;
            left: 18px;
            top: 50%;
            transform: translateY(-50%);
            color: var(--gris);
        }

        .filtre-btn {
            padding: 12px 22px;
            background: var(--noir-card);
            border: 1px solid rgba(255,255,255,0.1);
            border-radius: 50px;
            color: rgba(255,255,255,0.6);
            font-size: 14px;
            font-weight: 500;
            cursor: pointer;
            transition: all 0.3s;
            font-family: 'Poppins', sans-serif;
        }

        .filtre-btn:hover,
        .filtre-btn.active {
            background: rgba(255,107,0,0.15);
            border-color: var(--orange);
            color: var(--orange);
        }

        /* ===== PRODUITS GRID ===== */
        .produits-grid {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 25px;
        }

        .produit-card {
            background: var(--noir-card);
            border-radius: 20px;
            overflow: hidden;
            border: 1px solid rgba(255,255,255,0.05);
            transition: all 0.4s;
        }

        .produit-card:hover {
            transform: translateY(-8px);
            border-color: rgba(255,107,0,0.3);
            box-shadow: 0 20px 40px rgba(255,107,0,0.15);
        }

        .produit-image {
            position: relative;
            height: 200px;
            overflow: hidden;
        }

        .produit-image img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            transition: transform 0.5s;
        }

        .produit-card:hover .produit-image img {
            transform: scale(1.05);
        }

        .produit-badge {
            position: absolute;
            top: 12px;
            left: 12px;
            padding: 4px 12px;
            border-radius: 50px;
            font-size: 11px;
            font-weight: 700;
        }

        .badge-bestseller {
            background: var(--gradient);
            color: var(--blanc);
        }

        .badge-nouveau {
            background: linear-gradient(135deg, #00C853, #007B33);
            color: var(--blanc);
        }

        .badge-promo {
            background: linear-gradient(135deg, #FFD700, #FF8C00);
            color: var(--noir);
        }

        .produit-wishlist {
            position: absolute;
            top: 12px;
            right: 12px;
            width: 35px;
            height: 35px;
            background: rgba(0,0,0,0.5);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: all 0.3s;
            border: none;
            color: var(--blanc);
            font-size: 14px;
        }

        .produit-wishlist:hover {
            background: var(--orange);
        }

        .produit-info {
            padding: 20px;
        }

        .produit-categorie {
            font-size: 11px;
            color: var(--orange);
            font-weight: 600;
            letter-spacing: 1px;
            text-transform: uppercase;
            margin-bottom: 6px;
        }

        .produit-info h4 {
            font-size: 15px;
            font-weight: 600;
            margin-bottom: 8px;
            line-height: 1.3;
        }

        .produit-rating {
            display: flex;
            align-items: center;
            gap: 5px;
            margin-bottom: 12px;
        }

        .stars { color: #FFD700; font-size: 13px; }

        .rating-count {
            color: var(--gris);
            font-size: 12px;
        }

        .produit-prix-row {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 15px;
        }

        .produit-prix {
            font-size: 22px;
            font-weight: 700;
            color: var(--orange);
        }

        .produit-prix-old {
            font-size: 14px;
            color: var(--gris);
            text-decoration: line-through;
        }

        .produit-stock {
            font-size: 12px;
            color: var(--vert);
        }

        .produit-stock.low { color: #FFD700; }
        .produit-stock.out { color: #FF4444; }

        .btn-ajouter {
            width: 100%;
            padding: 12px;
            background: transparent;
            border: 2px solid var(--orange);
            color: var(--orange);
            border-radius: 12px;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            font-family: 'Poppins', sans-serif;
        }

        .btn-ajouter:hover {
            background: var(--orange);
            color: var(--blanc);
        }

        .btn-ajouter.added {
            background: var(--vert);
            border-color: var(--vert);
            color: var(--blanc);
        }

        /* ===== PANIER SIDEBAR ===== */
        .cart-sidebar {
            position: fixed;
            right: -400px;
            top: 0;
            width: 380px;
            height: 100vh;
            background: var(--noir-card);
            border-left: 1px solid rgba(255,255,255,0.05);
            z-index: 200;
            transition: right 0.4s ease;
            display: flex;
            flex-direction: column;
        }

        .cart-sidebar.open { right: 0; }

        .cart-header {
            padding: 25px;
            border-bottom: 1px solid rgba(255,255,255,0.05);
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .cart-header h3 {
            font-size: 18px;
            font-weight: 700;
        }

        .cart-close {
            background: none;
            border: none;
            color: var(--gris);
            font-size: 20px;
            cursor: pointer;
            transition: color 0.3s;
        }

        .cart-close:hover { color: var(--blanc); }

        .cart-items {
            flex: 1;
            overflow-y: auto;
            padding: 20px;
        }

        .cart-item {
            display: flex;
            gap: 15px;
            padding: 15px 0;
            border-bottom: 1px solid rgba(255,255,255,0.05);
        }

        .cart-item img {
            width: 70px;
            height: 70px;
            border-radius: 10px;
            object-fit: cover;
        }

        .cart-item-info { flex: 1; }

        .cart-item-info h4 {
            font-size: 14px;
            font-weight: 600;
            margin-bottom: 5px;
        }

        .cart-item-prix {
            color: var(--orange);
            font-weight: 700;
            font-size: 15px;
        }

        .cart-item-qty {
            display: flex;
            align-items: center;
            gap: 10px;
            margin-top: 8px;
        }

        .qty-btn {
            width: 28px;
            height: 28px;
            background: rgba(255,255,255,0.05);
            border: 1px solid rgba(255,255,255,0.1);
            border-radius: 6px;
            color: var(--blanc);
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 14px;
            transition: all 0.3s;
        }

        .qty-btn:hover {
            background: var(--orange);
            border-color: var(--orange);
        }

        .cart-item-remove {
            background: none;
            border: none;
            color: var(--gris);
            cursor: pointer;
            font-size: 16px;
            transition: color 0.3s;
        }

        .cart-item-remove:hover { color: #FF4444; }

        .cart-empty {
            text-align: center;
            padding: 60px 20px;
            color: var(--gris);
        }

        .cart-empty i {
            font-size: 48px;
            margin-bottom: 15px;
            color: rgba(255,255,255,0.1);
        }

        .cart-footer {
            padding: 25px;
            border-top: 1px solid rgba(255,255,255,0.05);
        }

        .cart-total {
            display: flex;
            justify-content: space-between;
            margin-bottom: 20px;
        }

        .cart-total span:first-child {
            color: var(--gris);
            font-size: 15px;
        }

        .cart-total span:last-child {
            font-size: 22px;
            font-weight: 700;
            color: var(--orange);
        }

        .btn-checkout {
            width: 100%;
            padding: 16px;
            background: var(--gradient);
            color: var(--blanc);
            border: none;
            border-radius: 12px;
            font-size: 16px;
            font-weight: 700;
            cursor: pointer;
            font-family: 'Poppins', sans-serif;
            transition: all 0.3s;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
        }

        .btn-checkout:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 30px rgba(255,107,0,0.4);
        }

        .cart-overlay {
            position: fixed;
            inset: 0;
            background: rgba(0,0,0,0.5);
            z-index: 150;
            display: none;
        }

        .cart-overlay.show { display: block; }

        /* ===== RESPONSIVE ===== */
        @media (max-width: 1200px) {
            .produits-grid {
                grid-template-columns: repeat(3, 1fr);
            }
        }

        @media (max-width: 768px) {
            .sidebar { display: none; }
            .main-content { margin-left: 0; }
            .produits-grid { grid-template-columns: repeat(2, 1fr); }
            .boutique-body { padding: 20px; }
        }

        @media (max-width: 480px) {
            .produits-grid { grid-template-columns: 1fr; }
        }
    </style>
</head>
<body>

<!-- ===== SIDEBAR ===== -->

        <span style="font-size:28px">🔥</span>

<!-- ===== MAIN ===== -->
<div class="main-content">

    <header class="page-header">
        <div>
            <h1>NOTRE <span>BOUTIQUE</span></h1>
            <p style="color:var(--gris);font-size:13px;margin-top:3px">
                10 produits disponibles
            </p>
        </div>
        <div class="header-actions">
            <button class="cart-btn" onclick="toggleCart()">
                <i class="fas fa-shopping-cart"></i>
                Mon Panier
                <span class="cart-count" id="cartCount">0</span>
            </button>
        </div>
    </header>

    <div class="boutique-body">

        <!-- Filtres -->
        <div class="filtres">
            <div class="filtre-search">
                <i class="fas fa-search"></i>
                <input type="text"
                       placeholder="Rechercher un produit..."
                       id="searchInput"
                       oninput="filterProducts()">
            </div>
            <button class="filtre-btn active"
                    onclick="filterByCategorie('tous', this)">
                Tous
            </button>
            <button class="filtre-btn"
                    onclick="filterByCategorie('Suppléments', this)">
                Suppléments
            </button>
            <button class="filtre-btn"
                    onclick="filterByCategorie('Vêtements', this)">
                Vêtements
            </button>
            <button class="filtre-btn"
                    onclick="filterByCategorie('Équipements', this)">
                Équipements
            </button>
        </div>

        <!-- Produits Grid -->
        <div class="produits-grid" id="produitsGrid">
            <!-- Chargé dynamiquement -->
        </div>

    </div>
</div>

<!-- ===== OVERLAY ===== -->
<div class="cart-overlay" id="cartOverlay"
     onclick="toggleCart()">
</div>

<!-- ===== PANIER ===== -->
<div class="cart-sidebar" id="cartSidebar">
    <div class="cart-header">
        <h3>🛒 Mon Panier</h3>
        <button class="cart-close" onclick="toggleCart()">
            <i class="fas fa-times"></i>
        </button>
    </div>

    <div class="cart-items" id="cartItems">
        <div class="cart-empty">
            <i class="fas fa-shopping-cart"></i>
            <p>Votre panier est vide</p>
        </div>
    </div>

    <div class="cart-footer">
        <div class="cart-total">
            <span>Total</span>
            <span id="cartTotal">0.00US</span>
        </div>
        <button class="btn-checkout" onclick="checkout()">
            <i class="fas fa-lock"></i>
            PAYER MAINTENANT
        </button>
    </div>
</div>

                            loading="lazy">
                        ${badgeHtml}
                        <button class="produit-wishlist">
                            <i class="far fa-heart"></i>
                        </button>
                    </div>
                    <div class="produit-info">
                        <div class="produit-categorie">
                            ${p.categorie}
                        </div>
                        <h4>${p.nom}</h4>
                        <div class="produit-rating">
                            <span class="stars">${stars}</span>
                            <span class="rating-count">
                                (${p.reviews})
                            </span>
                        </div>
                        <div class="produit-prix-row">
                            <div>
                                <div class="produit-prix">
                                    ${p.prix.toFixed(2)}$
                                </div>
                                ${prixOldHtml}
                            </div>
                            <span class="produit-stock ${stockClass}">
                                ${stockText}
                            </span>
                        </div>
                        <button class="btn-ajouter"
                            onclick="addToCart(${p.id})"
                            id="btn-${p.id}"
                            ${p.stock === 0 ? 'disabled' : ''}>
                            <i class="fas fa-shopping-cart"></i>
                            ${p.stock === 0 ?
                                'Indisponible' : 'Ajouter au panier'}
                        </button>
                    </div>
                </div>`;
        });
    };

    // Filtrer par catégorie
    const filterByCategorie = (cat, btn) => {
        currentCategorie = cat;
        document.querySelectorAll('.filtre-btn')
            .forEach(b => b.classList.remove('active'));
        btn.classList.add('active');
        filterProducts();
    };

    // Filtrer par recherche
    const filterProducts = () => {
        const search = document.getElementById('searchInput')
            .value.toLowerCase();
        let filtered = produitsStatiques;

        if (currentCategorie !== 'tous') {
            filtered = filtered.filter(p =>
                p.categorie === currentCategorie);
        }

        if (search) {
            filtered = filtered.filter(p =>
                p.nom.toLowerCase().includes(search));
        }

        renderProduits(filtered);
    };

    // Ajouter au panier
    const addToCart = (id) => {
        if (!token) {
            window.location.href = 'login.html';
            return;
        }

        const produit = produitsStatiques.find(p => p.id === id);
        const existing = cart.find(item => item.id === id);

        if (existing) {
            existing.qty++;
        } else {
            cart.push({ ...produit, qty: 1 });
        }

        localStorage.setItem('cart', JSON.stringify(cart));
        updateCartUI();

        const btn = document.getElementById(`btn-${id}`);
        btn.classList.add('added');
        btn.innerHTML = '<i class="fas fa-check"></i> Ajouté !';

        setTimeout(() => {
            btn.classList.remove('added');
            btn.innerHTML =
                '<i class="fas fa-shopping-cart"></i> Ajouter au panier';
        }, 2000);
    };

    // Mettre à jour UI panier
  const updateCartUI = () => {
    const cartCountEl = document.getElementById('cartCount');
    const cartTotalEl = document.getElementById('cartTotal');
    const cartItems = document.getElementById('cartItems');

    if (!cartCountEl || !cartTotalEl || !cartItems) return;

    const total = cart.reduce((sum, item) => sum + (item.prix * item.qty), 0);
    const count = cart.reduce((sum, item) => sum + item.qty, 0);

    cartCountEl.textContent = count;
    cartTotalEl.textContent = `${total.toFixed(2)}€`;

    if (cart.length === 0) {
        cartItems.innerHTML = `
            <div class="cart-empty">
                <i class="fas fa-shopping-cart"></i>
                <p>Votre panier est vide</p>
            </div>`;
        return;
    }
        cartItems.innerHTML = cart.map(item => `
            <div class="cart-item">
                <img src="${item.image}" alt="${item.nom}">
                <div class="cart-item-info">
                    <h4>${item.nom}</h4>
                    <div class="cart-item-prix">
                        ${(item.prix * item.qty).toFixed(2)}€
                    </div>
                    <div class="cart-item-qty">
                        <button class="qty-btn"
                            onclick="updateQty(${item.id}, -1)">
                            −
                        </button>
                        <span>${item.qty}</span>
                        <button class="qty-btn"
                            onclick="updateQty(${item.id}, 1)">
                            +
                        </button>
                    </div>
                </div>
                <button class="cart-item-remove"
                    onclick="removeFromCart(${item.id})">
                    <i class="fas fa-trash"></i>
                </button>
            </div>`).join('');
    };

    // Modifier quantité
    const updateQty = (id, delta) => {
        const item = cart.find(i => i.id === id);
        if (item) {
            item.qty += delta;
            if (item.qty <= 0) {
                removeFromCart(id);
                return;
            }
        }
        localStorage.setItem('cart', JSON.stringify(cart));
        updateCartUI();
    };

    // Supprimer du panier
    const removeFromCart = (id) => {
        cart = cart.filter(i => i.id !== id);
        localStorage.setItem('cart', JSON.stringify(cart));
        updateCartUI();
    };

    // Toggle panier
    const toggleCart = () => {
        const sidebar = document.getElementById('cartSidebar');
        const overlay = document.getElementById('cartOverlay');
        sidebar.classList.toggle('open');
        overlay.classList.toggle('show');
    };


// Charger config Stripe

let stripeInitialized = false;

const initStripe = async () => {
    if (stripeInitialized) return;
    const res = await fetch(`${API_URL}/api/paiement/config`);
    const config = await res.json();
    stripe = Stripe(config.publicKey);
    stripeInitialized = true;
};
// Checkout avec Stripe

const checkout = async () => {
    if (cart.length === 0) {
        alert('Votre panier est vide !');
        return;
    }
    if (!token) {
        window.location.href = 'login.html';
        return;
    }

    // ✅ Initialiser Stripe avant tout
    await initStripe();

    const total = cart.reduce(
        (sum, item) => sum + (item.prix * item.qty), 0);
    const montantCentimes = Math.round(total * 100);

    try {
        const res = await fetch(
            `${API_URL}/api/paiement/create-payment-intent`, {
            method: 'POST',
            headers: {
                'Authorization': `Bearer ${token}`,
                'Content-Type': 'application/json'
            },
            body: JSON.stringify({
                montant: montantCentimes,
                description: `Commande IRONFORGE - ${cart.length} article(s)`
            })
        });

        const data = await res.json();

        if (data.succes) {
            afficherFormulairePaiement(
                data.data.clientSecret,
                data.data.intentId,
                total
            );
        }
    } catch (err) {
        alert('Erreur lors de la création du paiement');
    }
};



// Afficher formulaire Stripe
const afficherFormulairePaiement = (clientSecret, intentId, total) => {
    document.getElementById('cartSidebar').innerHTML = `
        <div class="cart-header">
            <h3>💳 Paiement sécurisé</h3>
            <button class="cart-close" onclick="toggleCart()">
                <i class="fas fa-times"></i>
            </button>
        </div>
        <div style="padding:25px">
            <div style="margin-bottom:20px;padding:15px;
                background:rgba(255,107,0,0.1);
                border-radius:12px;border:1px solid rgba(255,107,0,0.2)">
                <div style="font-size:13px;color:var(--gris)">
                    Total à payer
                </div>
                <div style="font-family:'Bebas Neue',sans-serif;
                    font-size:36px;color:var(--orange)">
                    ${total.toFixed(2)}€
                </div>
            </div>
            <div id="stripe-elements"></div>
            <button id="btnPayer" onclick="payerCommande('${intentId}', ${total})"
                style="width:100%;padding:16px;margin-top:20px;
                background:linear-gradient(135deg,#FF6B00,#FF0000);
                color:white;border:none;border-radius:12px;
                font-size:16px;font-weight:700;cursor:pointer;
                font-family:'Poppins',sans-serif">
                <i class="fas fa-lock"></i> Payer ${total.toFixed(2)}€
            </button>
            <button onclick="toggleCart()"
                style="width:100%;padding:12px;margin-top:10px;
                background:transparent;border:1px solid rgba(255,255,255,0.1);
                color:var(--gris);border-radius:12px;cursor:pointer;
                font-family:'Poppins',sans-serif">
                Retour au panier
            </button>
        </div>`;

    // Créer éléments Stripe
    elements = stripe.elements({ clientSecret });
    const paymentElement = elements.create('payment');
    paymentElement.mount('#stripe-elements');
};

// Payer commande
const payerCommande = async (intentId, total) => {
    const btn = document.getElementById('btnPayer');
    btn.innerHTML = '<i class="fas fa-spinner fa-spin"></i> Traitement...';
    btn.disabled = true;

    try {
        const { error } = await stripe.confirmPayment({
            elements,
            confirmParams: {
                return_url: window.location.href
            },
            redirect: 'if_required'
        });

        if (error) {
            alert('Erreur : ' + error.message);
            btn.innerHTML = `<i class="fas fa-lock"></i> Payer ${total.toFixed(2)}€`;
            btn.disabled = false;
        } else {
            // Confirmer côté backend
            const res = await fetch(
                `${API_URL}/api/paiement/confirmer-commande`, {
                method: 'POST',
                headers: {
                    'Authorization': `Bearer ${token}`,
                    'Content-Type': 'application/json'
                },
                body: JSON.stringify({
                    paymentIntentId: intentId,
                    total: total
                })
            });

            const data = await res.json();

            if (data.succes) {
                cart = [];
                localStorage.removeItem('cart');
                toggleCart();
                alert('✅ Paiement réussi ! Commande confirmée !');
            }
        }
    } catch (err) {
        alert('Erreur paiement : ' + err.message);
        btn.disabled = false;
    }
};


    // Logout
    const logout = () => {
        localStorage.removeItem('token');
        localStorage.removeItem('user');
        localStorage.removeItem('cart');
        window.location.href = 'login.html';
    };

    // Wishlist toggle
    document.addEventListener('click', (e) => {
        if (e.target.closest('.produit-wishlist')) {
            const btn = e.target.closest('.produit-wishlist');
            const icon = btn.querySelector('i');
            icon.className = icon.className.includes('far') ?
                'fas fa-heart' : 'far fa-heart';
            icon.style.color = icon.className.includes('fas') ?
                '#FF4444' : '';
        }
    });

    // Init
    allProduits = produitsStatiques;
    renderProduits(allProduits);
    updateCartUI();
</script>
</body>
</html>
